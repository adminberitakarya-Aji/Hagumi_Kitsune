<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#2B2B33" />
    <title>HAGUMI (育み)</title>
    <style>
      :root {
        --washi: #f5efe0;
        --indigo: #3d4a6b;
        --hanko: #c1443c;
        --ink: #2b2b33;
        --wood: #c9a87c;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        height: 100%;
        background: var(--ink);
        font-family: "DotGothic16", "Courier New", monospace;
        overflow: hidden;
        touch-action: none;
      }
      /* Panggung: kanvas Phaser 360x640 fit center (Doc 12 §1.1) */
      #stage {
        position: relative;
        width: 360px;
        height: 640px;
        margin: 0 auto;
        top: 50%;
        transform: translateY(-50%);
        background: var(--washi);
        overflow: hidden;
      }
      #game-canvas { position: absolute; inset: 0; }
      /* ===== HUD ATAS (48px, Doc 12 §1.3) — DOM overlay ===== */
      .hud {
        position: absolute;
        top: 0; left: 0; right: 0;
        height: 48px;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 0 16px;
        background: rgba(245, 239, 224, 0.92);
        border-bottom: 2px solid var(--indigo);
        z-index: 3;
      }
      .hud .pet-info {
        font-size: 12px; color: var(--indigo); white-space: nowrap;
      }
      .hud .stats {
        display: grid; grid-template-columns: repeat(2, auto); gap: 2px 8px;
        flex: 1; min-width: 0;
      }
      .stat { display: flex; align-items: center; gap: 4px; font-size: 10px; color: var(--indigo); }
      .stat .bar { width: 28px; height: 8px; background: #e8e0ce; border-radius: 4px; overflow: hidden; }
      .stat .bar > i { display: block; height: 100%; background: var(--hanko); }
      .hud .coins { font-size: 13px; color: var(--hanko); }
      .hud .gear { width: 32px; height: 32px; font-size: 16px; background: none; border: none; cursor: pointer; }
      /* ===== ACTION BAR (44px, Doc 12 §3.2 — grid 6 tetap) ===== */
      .action-bar {
        position: absolute;
        bottom: 0; left: 0; right: 0;
        height: 44px;
        display: flex;
        gap: 4px;
        padding: 0 4px;
        background: rgba(245, 239, 224, 0.92);
        border-top: 2px solid var(--indigo);
        z-index: 3;
      }
      .action-bar button {
        flex: 1;
        min-width: 48px; /* hitbox sentuh ≥48px (Doc 12 §2.6) */
        height: 36px;
        align-self: center;
        font-size: 14px;
        font-family: inherit;
        background: var(--washi);
        border: 2px solid var(--indigo);
        border-radius: 8px;
        cursor: pointer;
      }
      .action-bar button:active { transform: scale(0.94); }
    </style>
  </head>
  <body>
    <div id="stage">
      <!-- Area scene: kanvas Phaser (pet, tatami, fx) -->
      <div id="game-canvas"></div>

      <!-- HUD ATAS (Doc 12 §1.3: H1 nama+umur · H2 stat mini · H4 koin · H5 gear) -->
      <header class="hud">
        <div class="pet-info">Kogitsune · Hari 1</div>
        <div class="stats" aria-label="stat pet">
          <span class="stat">🍖<span class="bar"><i style="width: 80%"></i></span></span>
          <span class="stat">😊<span class="bar"><i style="width: 80%"></i></span></span>
          <span class="stat">⚡<span class="bar"><i style="width: 80%"></i></span></span>
          <span class="stat">🧼<span class="bar"><i style="width: 80%"></i></span></span>
        </div>
        <div class="coins">🪙 100</div>
        <button class="gear" aria-label="pengaturan">⚙️</button>
      </header>

      <!-- ACTION BAR grid-6 tetap (Doc 12 §3.2) -->
      <nav class="action-bar" aria-label="menu utama">
        <button title="Dapur">🍖</button>
        <button title="Onsen">♨️</button>
        <button title="Futon">🛏️</button>
        <button title="Toko">🏪</button>
        <button title="Album">📖</button>
        <button title="Chat">💬</button>
      </nav>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
